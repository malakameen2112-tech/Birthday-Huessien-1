<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy 21st Birthday, Huessien 🤎</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#160f17;
    color:#f7eee9;
    font-family:'Montserrat',sans-serif;
    overflow-x:hidden;
}

.grain{
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.08;
    z-index:50;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
}

.floating-hearts{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5;
    overflow:hidden;
}

.floating-hearts span{
    position:absolute;
    bottom:-30px;
    color:#d99a9e;
    opacity:.45;
    animation:floatUp linear forwards;
}

@keyframes floatUp{
    from{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }

    15%{
        opacity:.5;
    }

    to{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

.music-btn{
    position:fixed;
    top:22px;
    right:20px;
    z-index:60;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(25,15,23,.85);
    color:#f8e9e4;
    padding:12px 18px;
    border-radius:30px;
    cursor:pointer;
    backdrop-filter:blur(10px);
    font-size:12px;
}

.music-icon{
    margin-right:7px;
}

main{
    position:relative;
    z-index:2;
}

section{
    padding:110px 8%;
}

.hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
}

.hero-glow{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(166,89,102,.18);
    filter:blur(100px);
}

.eyebrow,
.section-kicker{
    color:#c99599;
    font-size:11px;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-bottom:20px;
}

.hero h1{
    position:relative;
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(60px,13vw,125px);
    line-height:.82;
    font-weight:600;
}

.hero h1 span{
    color:#d99a9e;
    font-style:italic;
}

.hero-sub{
    margin-top:30px;
    max-width:600px;
    color:#cdbfc0;
    line-height:1.8;
    font-size:14px;
}

.age{
    margin-top:35px;
    font-family:'Cormorant Garamond',serif;
    font-size:90px;
    color:#d99a9e;
    opacity:.8;
}

.scroll{
    margin-top:30px;
    font-size:10px;
    letter-spacing:3px;
    color:#9d8d90;
}

.scroll span{
    color:#d99a9e;
    font-size:18px;
}

.intro{
    max-width:850px;
    margin:auto;
    text-align:center;
}

h2{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(45px,7vw,78px);
    line-height:.95;
    font-weight:600;
}

h2 em{
    color:#d99a9e;
}

.intro p,
.promise p,
.final p{
    max-width:650px;
    margin:30px auto 0;
    color:#bbaeb0;
    line-height:2;
    font-size:14px;
}

.gallery{
    max-width:1200px;
    margin:auto;
}

.section-heading{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:45px;
}

.counter{
    color:#9d8d90;
    font-size:12px;
    letter-spacing:2px;
}

.photo-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    grid-auto-rows:180px;
    gap:15px;
}

.photo{
    overflow:hidden;
    background:#251820;
    border:1px solid rgba(255,255,255,.08);
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:.7s;
}

.photo:hover img{
    transform:scale(1.06);
}

.p1{
    grid-column:span 3;
    grid-row:span 2;
}

.p2{
    grid-column:span 3;
}

.p3{
    grid-column:span 2;
}

.p4{
    grid-column:span 2;
}

.p5{
    grid-column:span 2;
}

.p6{
    grid-column:span 3;
}

.p7{
    grid-column:span 3;
}

.letter{
    max-width:950px;
    margin:auto;
}

.letter-card{
    position:relative;
    background:#21151e;
    border:1px solid rgba(255,255,255,.1);
    padding:70px 10%;
    box-shadow:0 30px 80px rgba(0,0,0,.25);
}

.seal{
    width:55px;
    height:55px;
    border:1px solid #b77d83;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cormorant Garamond',serif;
    font-size:27px;
    color:#d99a9e;
    margin-bottom:30px;
}

.letter-card h2{
    font-size:60px;
    margin-bottom:35px;
}

.letter-text p{
    color:#d1c4c5;
    font-family:'Cormorant Garamond',serif;
    font-size:20px;
    line-height:1.7;
    margin-bottom:22px;
}
